<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="大语言模型架构、计算规模与能耗学习笔记">
<title>LLM 架构与计算笔记</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e4ed;
    --muted: #8b8fa8;
    --accent: #5b8af0;
    --accent2: #a78bfa;
    --green: #34d399;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Noto Serif SC", serif;
    line-height: 1.7;
  }

  main {
    width: min(920px, calc(100% - 2rem));
    margin: 0 auto;
    padding: 5rem 0;
  }

  header {
    margin-bottom: 2.5rem;
  }

  h1 {
    margin: 0 0 0.6rem;
    color: #fff;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.25;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .articles {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.25rem;
  }

  .card {
    display: flex;
    min-height: 250px;
    flex-direction: column;
    padding: 1.5rem;
    color: inherit;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: transform 160ms ease, border-color 160ms ease;
  }

  .card:hover,
  .card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    outline: none;
  }

  .tag {
    color: var(--green);
    font: 600 0.8rem/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h2 {
    margin: 0.8rem 0 0.65rem;
    color: #fff;
    font-size: 1.35rem;
    line-height: 1.4;
  }

  .card p {
    margin: 0;
    color: var(--muted);
  }

  .open {
    margin-top: auto;
    padding-top: 1.25rem;
    color: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 600;
  }

  .llama .tag,
  .llama .open { color: var(--accent2); }

  .llama:hover,
  .llama:focus-visible { border-color: var(--accent2); }

  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  @media (max-width: 680px) {
    main { padding: 3rem 0; }
    .articles { grid-template-columns: 1fr; }
    .card { min-height: 220px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>LLM 架构与计算笔记</h1>
    <p>从经典 Transformer 到现代大模型：理解信息流、矩阵规模与能耗。</p>
  </header>

  <section class="articles" aria-label="文章列表">
    <a class="card" href="gpt3.html">
      <span class="tag">GPT-3 · 2020</span>
      <h2>GPT-3 计算规模、信息流与能耗</h2>
      <p>1750 亿参数模型的前向传播、矩阵运算规模、训练 FLOPs 与实际电能消耗。</p>
      <span class="open">阅读文章 →</span>
    </a>

    <a class="card llama" href="llama3-8b.html">
      <span class="tag">LLaMA-3 8B · 2024</span>
      <h2>现代 LLM 架构、计算规模与能耗</h2>
      <p>围绕 GQA、RoPE、SwiGLU、KV Cache 与 FlashAttention 拆解现代模型。</p>
      <span class="open">阅读文章 →</span>
    </a>
  </section>

  <footer>iEnjoy · GPU &amp; LLM Learning Notes</footer>
</main>
</body>
</html>
