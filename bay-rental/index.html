<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>湾区租房地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 html,body,#map{height:100%;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
 @supports (height:100dvh){html,body,#map{height:100dvh}}
 #panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;
        padding:12px 14px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.18);
        font-size:13px;max-width:210px}
 #panel label{display:block;margin:6px 0}
 #close{display:none;position:absolute;top:8px;right:10px;width:34px;height:34px;
        border:0;background:transparent;font-size:26px;line-height:1;color:#777;
        cursor:pointer;-webkit-tap-highlight-color:transparent}
 #fab{display:none;position:fixed;left:50%;transform:translateX(-50%);
      bottom:calc(14px + env(safe-area-inset-bottom));z-index:1200;
      background:#fff;border:1px solid #dcdfe4;border-radius:22px;
      box-shadow:0 3px 14px rgba(0,0,0,.28);padding:10px 18px;
      font:inherit;font-size:14px;color:#222;cursor:pointer;
      -webkit-tap-highlight-color:transparent}
 #fab b{color:#1a6fd4}
 .pop b{font-size:15px}
 .pop a{color:#1a5fb4}
 .tag{display:inline-block;background:#eef3fb;color:#1f3864;border-radius:4px;
      padding:1px 6px;margin:2px 3px 0 0;font-size:11px}

 @media (max-width:700px){
   #fab{display:block}
   #panel{top:auto;left:0;right:0;bottom:0;max-width:none;
          border-radius:16px 16px 0 0;
          padding:16px 18px calc(18px + env(safe-area-inset-bottom));
          box-shadow:0 -3px 18px rgba(0,0,0,.3);font-size:15px;
          max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
          transform:translateY(102%);transition:transform .22s ease}
   #panel.open{transform:translateY(0)}
   #panel>b{display:block;font-size:17px;margin-bottom:10px;padding-right:34px}
   #panel label{margin:0;padding:9px 0}
   #panel input[type=checkbox]{width:19px;height:19px;vertical-align:middle}
   #panel input[type=range]{width:100%;margin-top:8px}
   #close{display:block}
   .leaflet-control-zoom{display:none}
 }
</style></head><body>
<div id="map"></div>
<button id="fab" aria-controls="panel" aria-expanded="false">
  筛选 · <b id="fab-count">…</b> 套符合
</button>
<div id="panel">
  <button id="close" aria-label="关闭筛选">&times;</button>
  <b>筛选</b>
  <label>最高月租 $<span id="rv">3000</span><br>
    <input id="rent" type="range" min="500" max="4000" step="100" value="3000"></label>
  <label><input type="checkbox" id="kit"> 只看有厨房</label>
  <label><input type="checkbox" id="cpl"> 只看可夫妻</label>
  <label><input type="checkbox" id="prv"> 只看独立进出</label>
  <div id="count" style="margin-top:8px;color:#666"></div>
</div>
<script>
const map = L.map('map').setView([37.34,-122.02], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
let all=[], layer=L.layerGroup().addTo(map);

function color(s){return s>=70?'#1a7f37':s>=40?'#d4a72c':'#999'}

function render(){
  const maxRent=+document.getElementById('rent').value;
  const kit=document.getElementById('kit').checked;
  const cpl=document.getElementById('cpl').checked;
  const prv=document.getElementById('prv').checked;
  document.getElementById('rv').textContent=maxRent;
  layer.clearLayers(); let n=0;
  for(const f of all){
    const p=f.properties;
    if(p.rent && p.rent>maxRent) continue;
    if(kit && p.kitchen!==1) continue;
    if(cpl && p.couple_ok!==1) continue;
    if(prv && p.private_entrance!==1) continue;
    n++;
    const [lon,lat]=f.geometry.coordinates;
    const tags=[p.kitchen===1?'厨房':'',p.couple_ok===1?'可夫妻':'',
                p.private_entrance===1?'独立进出':'',p.utilities===1?'含水电':'']
               .filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join('');
    L.circleMarker([lat,lon],{radius:7,color:color(p.score),
      fillColor:color(p.score),fillOpacity:.75,weight:1})
     .bindPopup(`<div class="pop"><b>$${p.rent||'?'}/mo</b> · 分 ${p.score}<br>
       ${p.title||''}<br>${tags}<br>
       <small>${p.city||''} · ${p.source}</small><br>
       <a href="${p.url}" target="_blank">查看原帖 →</a></div>`)
     .addTo(layer);
  }
  document.getElementById('count').textContent = n + ' 套符合';
  document.getElementById('fab-count').textContent = n;
}
['rent','kit','cpl','prv'].forEach(id=>
  document.getElementById(id).addEventListener('input',render));

(function(){
  const panel=document.getElementById('panel');
  const fab=document.getElementById('fab');
  const isPhone=()=>window.matchMedia('(max-width:700px)').matches;

  function openPanel(){
    panel.classList.add('open');
    fab.style.display='none';
    fab.setAttribute('aria-expanded','true');
  }
  function closePanel(){
    panel.classList.remove('open');
    fab.style.display=isPhone()?'block':'none';
    fab.setAttribute('aria-expanded','false');
  }

  fab.addEventListener('click',openPanel);
  document.getElementById('close').addEventListener('click',closePanel);
  map.on('click',closePanel);
  map.on('movestart',closePanel);
  window.addEventListener('resize',()=>{
    if(!isPhone()){
      panel.classList.remove('open');
      fab.style.display='none';
    }else if(!panel.classList.contains('open')){
      fab.style.display='block';
    }
  });
})();

fetch('rentals.geojson').then(r=>r.json()).then(d=>{all=d.features;render();});
</script></body></html>
